# Stage veilcore-records on npm from CI, with provenance (RELEASING.md): npm trusted
# publishing, no long-lived npm token anywhere. Runs only when a version tag (v*) is pushed.
# The full gate (build, tests, every vector in TypeScript and Python, the pack check) runs
# before anything is uploaded. The version is only STAGED: it goes live when a maintainer
# approves it on npmjs.com with two-factor authentication, so a stolen GitHub account or a
# poisoned CI run alone cannot ship a release.
name: publish
on: { push: { tags: ['v*'] } }
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "24.11.1", registry-url: "https://registry.npmjs.org" }
      - name: The tag is the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: The gate
        run: npm run clean && npm run build && npm test && npm run conformance:python && node scripts/check-pack.mjs
      # Staged publishing needs npm 11.15.0 or later; Node 24.11.1 ships an older npm.
      - name: Stage it on npm (live only once approved with 2FA)
        run: npx --yes npm@11.15.0 stage publish --provenance --access public
